[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-report-automator"
version = "1.0.0"
description = "Turn messy sales exports (Excel/CSV) into a clean Excel report and a one-page PDF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
sales-report = "report_automator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
